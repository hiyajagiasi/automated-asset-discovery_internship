tools:
  subfinder: subfinder
  dnsx: dnsx
  httpx: httpx
  naabu: naabu
  nmap: nmap
  whatweb: whatweb
  webanalyze: /Users/sohampatil/go/bin/webanalyze
  nuclei: nuclei
  nuclei_templates: output/.nuclei-home/nuclei-templates
  nikto: nikto

output:
  subdomains: output/subdomains.txt
  live_hosts: output/live_hosts.txt
  dead_hosts: output/dead_host.txt
  ports: output/ports.txt
  technologies: output/technologies.txt
  security: output/security.txt

logging:
  file: logs/scan.log

reports:
  html: reports/report.html
  excel: reports/report.xlsx

timeouts:
  subfinder: 600
  httpx: 10
  naabu: 60
  nmap: 60
  whatweb: 60
  webanalyze: 30
  nikto: 60

threads: 5

limits:
  subdomains: 50
  max_live_host_candidates: 0
  nmap_parallel_workers: 8

httpx_options:
  threads: 100
  timeout: 10
  retries: 1
  rate_limit: 0
  stream: true
  response_size_to_read: 5000
  no_decode: true
  process_timeout: 0
  batch_size: 5000
  max_rounds: 20
  parallel_workers: 4
  max_total_threads: 400

dnsx_options:
  enabled: true
  threads: 200
  retries: 2
  timeout: 3
  rate_limit: 0
  resolvers:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9

batching:
  batch_size: 50
  workers: 4

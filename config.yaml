tools:
  subfinder: subfinder
  dnsx: dnsx
  httpx: httpx
  naabu: naabu
  nmap: nmap
  whatweb: whatweb
  webanalyze: /Users/sohampatil/go/bin/webanalyze
  nuclei: nuclei
  nuclei_templates: output/.nuclei-home/nuclei-templates
  nikto: nikto

output:
  subdomains: output/subdomains.txt
  live_hosts: output/live_hosts.txt
  dead_hosts: output/dead_host.txt
  ports: output/ports.txt
  technologies: output/technologies.txt
  security: output/security.txt

logging:
  file: logs/scan.log

reports:
  html: reports/report.html
  excel: reports/report.xlsx

timeouts:
  subfinder: 600
  httpx: 10
  naabu: 60
  nmap: 60
  whatweb: 60
  webanalyze: 30
  nikto: 60

threads: 5

limits:
  subdomains: 50
  max_live_host_candidates: 0
  nmap_parallel_workers: 8

httpx_options:
  # More conservative live-host probing for reliability on large target sets.
  threads: 100
  timeout: 15
  retries: 3
  rate_limit: 150
  stream: true
  # Technology detection benefits from more HTML/JS content, so allow a larger response body read.
  response_size_to_read: 10000
  no_decode: true
  # Optional whole-batch safety limit in seconds; 0 disables it (recommended).
  process_timeout: 0
  # Smaller batches release discovered live hosts to output quickly.
  batch_size: 1000
  max_rounds: 20
  parallel_workers: 2
  max_total_threads: 200

dnsx_options:
  enabled: true
  threads: 500
  retries: 1
  timeout: 5
  rate_limit: 0

batching:
  batch_size: 50
  workers: 4
